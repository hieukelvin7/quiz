<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Phòng thi · Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink:        #0e1726;
    --ink-2:      #16233b;
    --surface:    #1b2a46;
    --line:       #2b3c5c;
    --text:       #e8edf4;
    --muted:      #8a9bb4;
    --amber:      #f5b301;
    --teal:       #2dd4a7;
    --red:        #f2555a;
    --radius:     14px;
    --shadow:     0 24px 60px -24px rgba(0,0,0,.65);
    --sans:       'Inter', system-ui, sans-serif;
    --display:    'Space Grotesk', var(--sans);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--sans);
    color: var(--text);
    background:
      radial-gradient(1100px 600px at 85% -10%, rgba(245,179,1,.10), transparent 60%),
      radial-gradient(900px 600px at -10% 110%, rgba(45,212,167,.10), transparent 55%),
      var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    line-height: 1.55;
  }

  .stage { width: 100%; max-width: 640px; }

  /* ---------- Screens ---------- */
  .screen { display: none; animation: rise .5s cubic-bezier(.2,.7,.2,1); }
  .screen.is-active { display: block; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  @media (prefers-reduced-motion: reduce) {
    .screen { animation: none; }
    * { transition: none !important; }
  }

  .card {
    background: linear-gradient(180deg, var(--ink-2), var(--ink));
    border: 1px solid var(--line);
    border-radius: 22px;
    box-shadow: var(--shadow);
    padding: 40px 36px;
  }
  @media (max-width: 520px) { .card { padding: 28px 20px; } }

  /* ---------- Start screen ---------- */
  .brand {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: var(--display); font-weight: 700; letter-spacing: -.01em;
    font-size: 15px; color: var(--muted); margin-bottom: 28px;
  }
  .brand .dot {
    width: 10px; height: 10px; border-radius: 3px;
    background: var(--amber); box-shadow: 0 0 16px var(--amber);
  }

  h1 {
    font-family: var(--display); font-weight: 700;
    font-size: clamp(30px, 6vw, 44px); line-height: 1.05;
    letter-spacing: -.02em; margin-bottom: 12px;
  }
  .lede { color: var(--muted); max-width: 46ch; margin-bottom: 32px; }

  .field { margin-bottom: 18px; }
  .field label {
    display: block; font-size: 13px; font-weight: 600;
    color: var(--muted); margin-bottom: 8px;
  }
  .field input {
    width: 100%; font: inherit; color: var(--text);
    background: var(--ink); border: 1.5px solid var(--line);
    border-radius: var(--radius); padding: 14px 16px;
    transition: border-color .15s, box-shadow .15s;
  }
  .field input::placeholder { color: #5e6f8a; }
  .field input:focus {
    outline: none; border-color: var(--amber);
    box-shadow: 0 0 0 4px rgba(245,179,1,.14);
  }
  #code-input {
    font-family: var(--display); font-weight: 700;
    letter-spacing: .18em; text-transform: uppercase; font-size: 20px;
  }

  .btn {
    font: inherit; font-weight: 600; cursor: pointer;
    border: none; border-radius: var(--radius);
    padding: 15px 22px; transition: transform .12s, filter .15s, background .15s;
  }
  .btn:active { transform: translateY(1px) scale(.99); }
  .btn-primary {
    width: 100%; background: var(--amber); color: #2a1e00;
    font-size: 16px; margin-top: 10px;
  }
  .btn-primary:hover { filter: brightness(1.06); }
  .btn-primary.is-loading { opacity: .6; pointer-events: none; }
  .btn-ghost {
    background: transparent; color: var(--text);
    border: 1.5px solid var(--line);
  }
  .btn-ghost:hover { border-color: var(--muted); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }

  .field-note { min-height: 20px; margin-top: 14px; font-size: 14px; color: var(--muted); }
  .field-note.is-error { color: var(--red); }
  .field-note.is-ok { color: var(--teal); }

  /* ---------- Quiz header ---------- */
  .quiz-top {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; margin-bottom: 20px;
  }
  .quiz-meta { font-size: 13px; color: var(--muted); }
  .q-count { font-family: var(--display); font-weight: 600; font-size: 14px; }
  .q-count b { color: var(--amber); font-size: 18px; }

  .timer {
    font-family: var(--display); font-weight: 700; font-size: 20px;
    font-variant-numeric: tabular-nums; letter-spacing: .02em;
    padding: 8px 14px; border-radius: 10px;
    background: var(--ink); border: 1.5px solid var(--line);
  }
  .timer.is-urgent {
    color: var(--red); border-color: var(--red);
    animation: pulse 1s infinite;
  }
  @keyframes pulse { 50% { background: rgba(242,85,90,.12); } }

  .progress {
    height: 7px; background: var(--ink); border-radius: 99px;
    overflow: hidden; margin-bottom: 30px;
  }
  .progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--amber), var(--teal));
    border-radius: 99px; transition: width .4s cubic-bezier(.2,.7,.2,1);
  }

  .q-text {
    font-family: var(--display); font-weight: 600;
    font-size: clamp(20px, 4vw, 26px); line-height: 1.3;
    letter-spacing: -.01em; margin-bottom: 26px;
  }

  /* ---------- Options ---------- */
  .options { display: grid; gap: 12px; margin-bottom: 30px; }
  .option {
    display: flex; align-items: center; gap: 14px; width: 100%;
    text-align: left; font: inherit; color: var(--text); cursor: pointer;
    background: var(--ink); border: 1.5px solid var(--line);
    border-radius: var(--radius); padding: 15px 16px;
    transition: border-color .15s, background .15s, transform .1s;
  }
  .option:hover { border-color: var(--muted); }
  .option:active { transform: scale(.995); }
  .option-key {
    flex: 0 0 34px; height: 34px; display: grid; place-items: center;
    font-family: var(--display); font-weight: 700; font-size: 15px;
    border-radius: 9px; background: var(--surface); color: var(--muted);
    transition: inherit;
  }
  .option.is-selected {
    border-color: var(--amber); background: rgba(245,179,1,.08);
  }
  .option.is-selected .option-key {
    background: var(--amber); color: #2a1e00;
  }
  .option-text { flex: 1; }

  /* ---------- Nav ---------- */
  .quiz-nav { display: flex; gap: 12px; }
  .quiz-nav .btn { flex: 1; }
  .is-hidden { display: none !important; }

  /* ---------- Result ---------- */
  .result-head { text-align: center; margin-bottom: 10px; }
  .ring {
    --pct: 0;
    width: 180px; height: 180px; margin: 8px auto 20px;
    border-radius: 50%;
    background:
      radial-gradient(closest-side, var(--ink-2) 72%, transparent 73%),
      conic-gradient(var(--amber) calc(var(--pct) * 1%), var(--line) 0);
    display: grid; place-items: center;
  }
  .score-big {
    font-family: var(--display); font-weight: 700;
    font-size: 40px; letter-spacing: -.02em;
  }
  .score-label { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .result-meta { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 20px; }

  .divider { height: 1px; background: var(--line); margin: 24px 0; }

  .review-title {
    font-family: var(--display); font-weight: 600; font-size: 14px;
    color: var(--muted); margin-bottom: 14px;
  }
  .review-list {
    list-style: none; display: grid; grid-template-columns: minmax(0, 1fr);
    gap: 8px; margin-bottom: 26px;
  }
  .review-row {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 13px; border-radius: 11px;
    background: var(--ink); border: 1.5px solid var(--line); font-size: 14px;
  }
  .review-idx {
    flex: 0 0 26px; height: 26px; display: grid; place-items: center;
    border-radius: 7px; font-family: var(--display); font-weight: 700;
    font-size: 13px; background: var(--surface);
  }
  .review-q {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--muted);
  }
  .review-tag { font-weight: 600; font-size: 13px; }
  .review-row.is-ok  { border-color: rgba(45,212,167,.4); }
  .review-row.is-ok .review-idx { background: var(--teal); color: #042b22; }
  .review-row.is-ok .review-tag { color: var(--teal); }
  .review-row.is-no  { border-color: rgba(242,85,90,.4); }
  .review-row.is-no .review-idx { background: var(--red); color: #2b0406; }
  .review-row.is-no .review-tag { color: var(--red); }
  .review-tag { flex: 0 0 auto; white-space: nowrap; }

  /* ======= Nâng cấp: nút phụ, thống kê, ôn tập ======= */

  /* Hàng nút phụ ở trang chủ */
  .actions-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
  .hint-best { margin-top: 18px; font-size: 13px; color: var(--muted); text-align: center; }
  .hint-best b { color: var(--teal); font-weight: 600; }
  .hint-best:empty { display: none; }

  /* Đầu màn hình phụ (nút quay lại + tiêu đề) */
  .screen-head { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
  .back-btn {
    flex: 0 0 auto; width: 42px; height: 42px; display: grid; place-items: center;
    border-radius: 12px; background: var(--ink); border: 1.5px solid var(--line);
    color: var(--text); cursor: pointer; font-size: 20px; line-height: 1;
    transition: border-color .15s;
  }
  .back-btn:hover { border-color: var(--muted); }
  .screen-head h2 {
    font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: -.01em;
  }
  .sub { font-size: 13px; color: var(--muted); }
  .review-title .sub { font-weight: 400; }

  /* Ô số liệu */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 10px; }
  #result-tiles { margin-bottom: 4px; }
  .tile {
    background: var(--ink); border: 1.5px solid var(--line);
    border-radius: 13px; padding: 14px 10px; text-align: center;
  }
  .tile-num { font-family: var(--display); font-weight: 700; font-size: 23px; letter-spacing: -.01em; }
  .tile-label { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .tile.ok .tile-num { color: var(--teal); }
  .tile.no .tile-num { color: var(--red); }
  .tile.am .tile-num { color: var(--amber); }

  /* Xem lại có thể mở rộng */
  .review-item { display: block; }
  .review-row {
    width: 100%; font: inherit; color: inherit; text-align: left; cursor: pointer;
  }
  .review-row.open { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
  .review-caret { flex: 0 0 auto; color: var(--muted); transition: transform .2s; font-size: 12px; }
  .review-row.open .review-caret { transform: rotate(90deg); }
  .review-detail {
    display: none; padding: 14px; margin-top: -1px;
    border: 1.5px solid var(--line); border-top: none;
    border-radius: 0 0 11px 11px; background: rgba(0,0,0,.18);
  }
  .review-detail.is-open { display: block; }
  .detail-q { font-weight: 600; margin-bottom: 12px; line-height: 1.4; }
  .opt-line {
    display: flex; align-items: center; gap: 10px; padding: 9px 11px;
    border-radius: 9px; border: 1.5px solid var(--line); margin-bottom: 7px; font-size: 14px;
  }
  .opt-line:last-child { margin-bottom: 0; }
  .opt-line .k {
    flex: 0 0 26px; height: 26px; display: grid; place-items: center; border-radius: 7px;
    font-family: var(--display); font-weight: 700; font-size: 13px;
    background: var(--surface); color: var(--muted);
  }
  .opt-txt { flex: 1; min-width: 0; }
  .opt-flag { flex: 0 0 auto; font-size: 12px; font-weight: 600; }
  .opt-line.correct { border-color: rgba(45,212,167,.5); background: rgba(45,212,167,.08); }
  .opt-line.correct .k { background: var(--teal); color: #042b22; }
  .opt-line.correct .opt-flag { color: var(--teal); }
  .opt-line.wrong { border-color: rgba(242,85,90,.5); background: rgba(242,85,90,.08); }
  .opt-line.wrong .k { background: var(--red); color: #2b0406; }
  .opt-line.wrong .opt-flag { color: var(--red); }

  /* Dùng lại .option cho chế độ Ôn tập (đáp án đúng tô xanh) */
  .option.is-correct { border-color: rgba(45,212,167,.5); background: rgba(45,212,167,.08); }
  .option.is-correct .option-key { background: var(--teal); color: #042b22; }
  .option.static { cursor: default; }

  /* Ô điền đục lỗ */
  .fill-input {
    width: 100%; font: inherit; color: var(--text); background: var(--ink);
    border: 1.5px solid var(--line); border-radius: var(--radius);
    padding: 16px; font-size: 17px;
    transition: border-color .15s, box-shadow .15s;
  }
  .fill-input::placeholder { color: #5e6f8a; }
  .fill-input:focus { outline: none; border-color: var(--amber); box-shadow: 0 0 0 4px rgba(245,179,1,.14); }

  /* Câu cloze: điền ngay trong câu */
  .cloze {
    font-family: var(--sans); font-weight: 400;
    font-size: 18px; line-height: 2.05; letter-spacing: 0; margin-bottom: 20px;
  }
  .fill-input.inline {
    display: inline-block; width: 120px; min-width: 60px; max-width: 100%;
    padding: 2px 10px; font-size: 17px; font-family: var(--sans); font-weight: 500;
    border: none; border-bottom: 2px solid var(--amber); border-radius: 7px 7px 0 0;
    background: rgba(245,179,1,.08); color: var(--text); vertical-align: baseline;
    margin: 0 2px;
  }
  .fill-input.inline::placeholder { color: var(--amber); opacity: .6; }
  .fill-input.inline:focus { box-shadow: none; background: rgba(245,179,1,.16); }
  .blank { white-space: nowrap; }
  .blank-no {
    color: var(--amber); font-weight: 700; font-size: 12px;
    vertical-align: super; margin-right: 1px;
  }

  .cloze-ans { padding: 1px 8px; border-radius: 6px; font-weight: 600; white-space: nowrap; }
  .cloze-ans.ok { background: rgba(45,212,167,.16); color: var(--teal); }
  .cloze-ans.no { background: rgba(242,85,90,.16); color: var(--red); }

  .fill-hint { margin-top: 10px; font-size: 13px; color: var(--muted); }
  .fill-note { margin-top: 12px; font-size: 12px; color: var(--muted); }
  .opt-line.fill-line .opt-txt { font-weight: 500; }
  #fill-btn { width: 100%; margin-top: 12px; }
  #fill-btn .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 2px;
    background: var(--teal); margin-right: 8px; vertical-align: middle;
  }

  /* Nút trên màn kết quả */
  .result-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
  #retry-wrong-btn { grid-column: 1 / -1; }

  /* Biểu đồ tiến bộ */
  .chart-wrap { margin: 2px 0 26px; }
  .chart { width: 100%; height: 118px; display: block; }
  .chart-cap { font-size: 12px; color: var(--muted); text-align: center; margin-top: 10px; }

  /* Bảng theo mã đề + câu hay sai */
  .section-title {
    font-family: var(--display); font-weight: 600; font-size: 14px;
    color: var(--muted); margin: 6px 0 12px;
  }
  .stat-table { display: grid; gap: 8px; margin-bottom: 26px; }
  .stat-row {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px;
    background: var(--ink); border: 1.5px solid var(--line); border-radius: 11px; font-size: 14px;
  }
  .stat-row .code { font-family: var(--display); font-weight: 700; }
  .stat-row .grow { margin-left: auto; text-align: right; color: var(--muted); font-size: 13px; }
  .stat-row .grow b { color: var(--text); font-weight: 600; }

  .miss-list { display: grid; gap: 8px; margin-bottom: 24px; }
  .miss-row {
    display: flex; gap: 12px; align-items: center; padding: 12px 14px;
    background: var(--ink); border: 1.5px solid rgba(242,85,90,.32);
    border-radius: 11px; font-size: 14px;
  }
  .miss-row .txt { min-width: 0; flex: 1; }
  .miss-row .cnt { flex: 0 0 auto; color: var(--red); font-weight: 600; font-size: 13px; white-space: nowrap; }

  .empty { text-align: center; color: var(--muted); padding: 34px 10px; font-size: 14px; line-height: 1.6; }

  /* ================= MOBILE ================= */
  @media (max-width: 600px) {
    body { padding: 12px 10px; align-items: flex-start; }
    .card { padding: 22px 16px; border-radius: 18px; }

    .brand { margin-bottom: 18px; }
    h1 { font-size: clamp(26px, 8vw, 34px); }
    .lede { margin-bottom: 24px; }

    .quiz-top { gap: 10px; }
    .timer { font-size: 17px; padding: 6px 11px; }
    .q-count { font-size: 13px; }
    .q-count b { font-size: 16px; }
    .quiz-meta { font-size: 12px; }

    .q-text { font-size: 19px; margin-bottom: 20px; }
    .options { gap: 10px; margin-bottom: 22px; }
    .option { padding: 13px 13px; gap: 11px; border-radius: 12px; }
    .option-key { flex-basis: 30px; height: 30px; font-size: 14px; }

    .quiz-nav { gap: 10px; }
    .btn { padding: 13px 14px; font-size: 15px; }

    .ring { width: 140px; height: 140px; }
    .score-big { font-size: 32px; }
    .review-row { padding: 10px 11px; font-size: 13px; gap: 10px; }
    .review-idx { flex-basis: 24px; height: 24px; font-size: 12px; }
  }

  /* Màn hình rất hẹp: xếp nút điều hướng theo chiều dọc */
  @media (max-width: 360px) {
    .quiz-nav { flex-direction: column; }
  }
</style>
</head>
<body>
<main class="stage">

  <!-- ============ MÀN HÌNH 1: NHẬP MÃ ĐỀ ============ -->
  <section id="screen-start" class="screen is-active">
    <div class="card">
      <span class="brand"><span class="dot"></span>PHÒNG THI</span>
      <h1>Sẵn sàng làm bài?</h1>
      <p class="lede">Nhập tên và mã đề do giáo viên cung cấp. Hệ thống sẽ tải đúng bộ câu hỏi tương ứng.</p>

      <form id="start-form" novalidate>
        <div class="field">
          <label for="name-input">Họ và tên</label>
          <input id="name-input" type="text" placeholder="Nguyễn Văn A" autocomplete="name" />
        </div>
        <div class="field">
          <label for="code-input">Mã đề</label>
          <input id="code-input" type="text" placeholder="DE01" autocomplete="off" spellcheck="false" />
        </div>
        <button id="start-btn" type="submit" class="btn btn-primary">Bắt đầu làm bài</button>
      </form>
      <div class="actions-row">
        <button id="study-btn" type="button" class="btn btn-ghost">Ôn tập đáp án</button>
        <button id="stats-btn" type="button" class="btn btn-ghost">Thống kê</button>
      </div>
      <button id="fill-btn" type="button" class="btn btn-ghost"><span class="dot"></span>Điền đục lỗ (ngẫu nhiên)</button>
      <p id="start-note" class="field-note"></p>
      <p id="start-best" class="hint-best"></p>
    </div>
  </section>

  <!-- ============ MÀN HÌNH 2: LÀM BÀI ============ -->
  <section id="screen-quiz" class="screen">
    <div class="card">
      <div class="quiz-top">
        <div>
          <div class="q-count">Câu <b id="q-counter">1</b> / <span id="q-total">0</span></div>
          <div id="quiz-meta" class="quiz-meta"></div>
        </div>
        <div id="timer" class="timer">00:00</div>
      </div>

      <div class="progress"><div id="progress-fill" class="progress-fill"></div></div>

      <h2 id="q-text" class="q-text"></h2>
      <div id="options" class="options"></div>

      <div class="quiz-nav">
        <button id="prev-btn" class="btn btn-ghost">Câu trước</button>
        <button id="next-btn" class="btn btn-primary">Câu tiếp</button>
        <button id="submit-btn" class="btn btn-primary is-hidden">Nộp bài</button>
      </div>
    </div>
  </section>

  <!-- ============ MÀN HÌNH 3: KẾT QUẢ ============ -->
  <section id="screen-result" class="screen">
    <div class="card">
      <div class="result-head">
        <div id="result-ring" class="ring">
          <div>
            <div id="score-big" class="score-big">0/0</div>
            <div id="score-label" class="score-label"></div>
          </div>
        </div>
        <p id="result-meta" class="result-meta"></p>
        <p id="submit-note" class="field-note" style="text-align:center"></p>
      </div>

      <div class="tiles" id="result-tiles"></div>

      <div class="divider"></div>

      <p class="review-title">Xem lại bài làm <span class="sub">— bấm từng câu để xem đáp án</span></p>
      <ul id="review-list" class="review-list"></ul>

      <div class="result-actions">
        <button id="retry-wrong-btn" class="btn btn-primary is-hidden">Học lại câu sai</button>
        <button id="redo-btn" class="btn btn-ghost">Làm lại đề</button>
        <button id="to-stats-btn" class="btn btn-ghost">Thống kê</button>
        <button id="restart-btn" class="btn btn-ghost" style="grid-column:1 / -1">Về trang chủ</button>
      </div>
    </div>
  </section>

  <!-- ============ MÀN HÌNH 4: ÔN TẬP (xem đáp án) ============ -->
  <section id="screen-study" class="screen">
    <div class="card">
      <div class="screen-head">
        <button class="back-btn" type="button" data-back aria-label="Quay lại">←</button>
        <div>
          <h2>Ôn tập</h2>
          <div id="study-meta" class="sub"></div>
        </div>
      </div>

      <div class="progress"><div id="study-progress" class="progress-fill"></div></div>

      <h2 id="study-q" class="q-text"></h2>
      <div id="study-options" class="options"></div>

      <div class="quiz-nav">
        <button id="study-prev" class="btn btn-ghost">Câu trước</button>
        <button id="study-next" class="btn btn-primary">Câu tiếp</button>
      </div>
    </div>
  </section>

  <!-- ============ MÀN HÌNH 5: THỐNG KÊ ============ -->
  <section id="screen-stats" class="screen">
    <div class="card">
      <div class="screen-head">
        <button class="back-btn" type="button" data-back aria-label="Quay lại">←</button>
        <div>
          <h2>Thống kê của tôi</h2>
          <div class="sub">Lưu trên thiết bị này</div>
        </div>
      </div>
      <div id="stats-body"></div>
    </div>
  </section>

</main>
<script src="script.js"></script>
</body>
</html>
